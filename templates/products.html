{% extends "base.html" %}

{% block title %}Collection - Nara Optics{% endblock %}
{% block nav_products %}class="active"{% endblock %}

{% block content %}

<!-- Collection Header -->
<!-- Collection Video Banner -->
<section class="collection-video-banner">
    
    <video autoplay muted loop playsinline class="collection-bg-video">
        <source src="{{ url_for('static', filename='videos/collection.mp4') }}" type="video/mp4">
    </video>

    <div class="collection-overlay"></div>

    <div class="collection-content">
        <h1>THE COLLECTION</h1>
        <p>Timeless Frames. Refined Vision.</p>
    </div>

</section>

<!-- Products Section -->
<section class="products-section">
    <div class="container">
        <div class="products-grid" id="productsGrid">
            <!-- Products load dynamically -->
        </div>
    </div>
</section>

{% endblock %}

{% block extra_css %}
<style>

/* ===== COLLECTION HEADER ===== */

.luxury-collection-header {
    padding: 160px 0 100px;
    text-align: center;
    background: #fff;
}

.luxury-collection-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem;
    letter-spacing: 4px;
    margin-bottom: 20px;
}

.luxury-collection-header p {
    font-size: 1.2rem;
    color: #777;
    letter-spacing: 2px;
}

/* ===== PRODUCTS GRID ===== */

.products-section {
    padding: 80px 0 120px;
}

.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 60px;
}

/* ===== LUXURY PRODUCT CARD ===== */

.luxury-card {
    position: relative;
    overflow: hidden;
    transition: transform 0.6s ease;
}

.luxury-card img {
    width: 100%;
    height: 520px;
    object-fit: cover;
    transition: transform 0.8s ease;
}

.luxury-card:hover img {
    transform: scale(1.05);
}

.luxury-info {
    padding-top: 25px;
}

.luxury-info h3 {
    font-size: 1.2rem;
    letter-spacing: 2px;
    font-weight: 500;
    margin-bottom: 8px;
}

.luxury-price {
    color: var(--secondary-color);
    font-weight: 600;
    margin-bottom: 5px;
}

.luxury-info span {
    font-size: 0.85rem;
    color: #999;
    letter-spacing: 1px;
}

/* ===== EMPTY STATE HEADER ===== */

.luxury-header {
    text-align: center;
    margin-bottom: 80px;
}

.luxury-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

.luxury-header p {
    font-size: 1.2rem;
    color: #777;
    letter-spacing: 2px;
}

</style>
{% endblock %}

{% block extra_js %}
<script>

loadProducts();

function loadProducts() {
    fetch(`/api/products`)
        .then(response => response.json())
        .then(products => {

            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            /* ===== IF DATABASE EMPTY ===== */
            if (products.length === 0) {

                grid.innerHTML = `
                    <div style="grid-column:1/-1;">

                        <div class="luxury-header">
                            <h2>SIGNATURE COLLECTION</h2>
                            <p>Curated Craftsmanship Preview</p>
                        </div>

                        <div class="products-grid">

                            <div class="luxury-card">
                                <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=900" alt="">
                                <div class="luxury-info">
                                    <h3>NARA SIGNATURE GOLD</h3>
                                    <p class="luxury-price">$320</p>
                                    <span>Limited Preview</span>
                                </div>
                            </div>

                            <div class="luxury-card">
                                <img src="https://images.unsplash.com/photo-1574258495973-f010dfbb5371?w=900" alt="">
                                <div class="luxury-info">
                                    <h3>MIDNIGHT BLACK ELITE</h3>
                                    <p class="luxury-price">$410</p>
                                    <span>Exclusive Drop</span>
                                </div>
                            </div>

                            <div class="luxury-card">
                                <img src="https://images.unsplash.com/photo-1508296695146-257a814070b4?w=900" alt="">
                                <div class="luxury-info">
                                    <h3>ROYAL BRONZE EDITION</h3>
                                    <p class="luxury-price">$380</p>
                                    <span>Coming Soon</span>
                                </div>
                            </div>

                        </div>

                    </div>
                `;

                return;
            }

            /* ===== NORMAL DATABASE PRODUCTS ===== */

            products.forEach(product => {

                const productCard = `
                    <div class="luxury-card">
                        <a href="/product/${product.id}">
                            <img src="${product.image_url}" alt="${product.name}">
                        </a>
                        <div class="luxury-info">
                            <h3>${product.name.toUpperCase()}</h3>
                            <p class="luxury-price">$${product.price.toFixed(2)}</p>
                        </div>
                    </div>
                `;

                grid.innerHTML += productCard;
            });

        });
}

</script>
{% endblock %}
